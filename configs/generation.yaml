# PoliceGPT — LLM Generation & Legal Guardrails Configuration
# Tuned for grounded statutory question answering with Google Gemini 3.5 Flash

generation:
  model_name: "gemini-3.5-flash"       # Google Gemini model (gemini-3.5-flash)
  temperature: 0.1                     # Low temperature for deterministic, factual statutory responses
  max_output_tokens: 2048              # Maximum response token length
  context_budget_chars: 12000          # Maximum character budget for assembled context (~3000-4000 tokens)
  min_evidence_score: 0.012            # Minimum RRF score floor for retrieved candidates
  min_dense_score: 0.30                # Minimum dense similarity floor
  claim_support_threshold: 0.25        # Minimum claim overlap ratio to pass answer validation
