[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policegpt-rag"
version = "0.1.0"
description = "Specialized Multilingual Legal RAG for Bangladesh Police Regulations & Laws"
authors = [
    { name = "PoliceGPT Team" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.6.0",
    "accelerate>=0.28.0",
    "qdrant-client>=1.8.0",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "rich>=13.7.0"
]

[project.optional-dependencies]
embedding = [
    "FlagEmbedding>=1.2.0",
    "torch>=2.1.0",
    "pyarrow>=15.0.0"
]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "easyocr>=1.7.1",
    "paddleocr>=2.7.0",
    "pdfplumber>=0.10.3",
    "pymupdf>=1.23.0"
]
eval = [
    "ragas>=0.1.0",
    "scikit-learn>=1.4.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.2.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
